name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    needs: [quality, dialyzer, docs]

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "28"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "29"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: |
          mix deps.compile > /tmp/sigil_guard_deps_compile.log 2>&1 || {
            cat /tmp/sigil_guard_deps_compile.log
            exit 1
          }

      - name: Compile
        run: mix compile --no-deps-check --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Run coverage gate
        if: matrix.elixir == '1.18' && matrix.otp == '28'
        run: mix test --cover

      - name: Generate coverage report
        if: matrix.elixir == '1.18' && matrix.otp == '28'
        run: mix coveralls.lcov

      - name: Upload coverage reports to Codecov
        if: matrix.elixir == '1.18' && matrix.otp == '28'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - name: Restore deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-28-1.18-${{ hashFiles('**/mix.lock') }}

      - name: Run canonical quality gate
        run: ./bin/check

      - name: Install benchmark dependencies
        env:
          MIX_ENV: dev
        run: mix deps.get --check-locked

      - name: Run benchmark smoke
        env:
          MIX_ENV: dev
        run: mix bench --smoke

      - name: Compare benchmark smoke to baseline
        env:
          MIX_ENV: dev
        run: mix run bench/compare.exs

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      # Both _build and the PLT contain BEAM artifacts tied to the exact
      # installed OTP/Elixir patch versions. The setup inputs are loose ranges,
      # so use the action's resolved-version outputs for both cache keys.
      - name: Restore deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Restore PLT cache
        id: plt-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      - name: Remove stale PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: rm -rf priv/plts

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: |
          mix deps.compile > /tmp/sigil_guard_deps_compile.log 2>&1 || {
            cat /tmp/sigil_guard_deps_compile.log
            exit 1
          }

      - name: Compile
        run: mix compile --no-deps-check

      - name: Run Dialyzer
        run: mix dialyzer

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - name: Restore deps cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-28-1.18-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: |
          mix deps.compile > /tmp/sigil_guard_deps_compile.log 2>&1 || {
            cat /tmp/sigil_guard_deps_compile.log
            exit 1
          }

      - name: Generate docs
        run: mix docs

      - name: Check migration guide
        run: mix sigil.migration_gate

      - name: Check doc coverage
        run: mix doctor
