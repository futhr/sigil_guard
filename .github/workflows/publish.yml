name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - name: Restore deps cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-28-1.18-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run tests
        run: mix test

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Run Doctor
        run: mix doctor

      - name: Generate documentation
        run: mix docs

      - name: Build release artifacts
        run: |
          mkdir -p dist
          mix hex.build --output "dist/sigil_guard-${GITHUB_REF_NAME}.tar"
          mix sigil_guard.sbom --output "dist/sigil_guard-${GITHUB_REF_NAME}.spdx.json"
          mix sigil_guard.sbom --verify "dist/sigil_guard-${GITHUB_REF_NAME}.spdx.json"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sigil_guard-${{ github.ref_name }}-release-artifacts
          path: dist/*
          if-no-files-found: error

      - name: Attest release package provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/sigil_guard-${{ github.ref_name }}.tar

      - name: Attest release package SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/sigil_guard-${{ github.ref_name }}.tar
          sbom-path: dist/sigil_guard-${{ github.ref_name }}.spdx.json

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
